<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MamaFood — Meu Perfil</title>
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#ea1d2c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MamaFood" />
  <link rel="apple-touch-icon" href="../IMG_2462-removebg-preview.png" />
  <link rel="icon" type="image/png" href="../IMG_2462-removebg-preview.png" />
  <script src="../AppJs/devtools-protection.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../shared.css"/>
  <style>
    .perfil-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 800px; }
    .pf-card { background: var(--white); border-radius: 14px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .pf-card h2 { font-size: .95rem; font-weight: 800; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--gray-2); display: flex; align-items: center; gap: 8px; color: var(--dark); }
    .pf-item { margin-bottom: 14px; }
    .pf-item label { display: block; font-size: .75rem; font-weight: 700; color: var(--gray-3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
    .pf-item .val { font-size: .92rem; font-weight: 500; color: var(--dark); }
    .pf-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--red-light); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 16px; border: 3px solid var(--red); }
    .pf-name-big { font-size: 1.2rem; font-weight: 800; color: var(--dark); margin-bottom: 4px; }
    .pf-email-sm { font-size: .85rem; color: var(--gray-3); margin-bottom: 16px; }
    .badge-admin { display: inline-flex; align-items: center; gap: 6px; background: #fef2f2; color: var(--red); border: 1.5px solid #fecaca; padding: 4px 12px; border-radius: 20px; font-size: .75rem; font-weight: 700; }
    .badge-user  { display: inline-flex; align-items: center; gap: 6px; background: #eff6ff; color: var(--blue); border: 1.5px solid #bfdbfe; padding: 4px 12px; border-radius: 20px; font-size: .75rem; font-weight: 700; }
    .edit-link { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--red); font-weight: 600; margin-top: 16px; text-decoration: underline; }
    @media(max-width: 700px) { .perfil-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <div><span class="topbar-title">Meu Perfil</span><span class="topbar-sub"> — dados da conta</span></div>
      <div class="topbar-right">
        <div class="topbar-time"><i class="fa-regular fa-clock"></i><span id="clock">--:--</span></div>
      </div>
    </div>

    <div class="content">
      <div class="perfil-grid">

        <!-- Card identidade -->
        <div class="pf-card">
          <h2><i class="fa-solid fa-user" style="color:var(--red)"></i> Identificação</h2>
          <div class="pf-avatar" id="pf-avatar">👤</div>
          <div class="pf-name-big" id="pf-nome-big">—</div>
          <div class="pf-email-sm" id="pf-email-sm">—</div>
          <div id="pf-role-badge"></div>
          <a href="Tela1.html" class="edit-link"><i class="fa-solid fa-pen"></i> Editar cadastro</a>
        </div>

        <!-- Card contato -->
        <div class="pf-card">
          <h2><i class="fa-solid fa-address-card" style="color:var(--red)"></i> Contato</h2>
          <div class="pf-item">
            <label>E-mail</label>
            <div class="val" id="pf-email">—</div>
          </div>
          <div class="pf-item">
            <label>Celular</label>
            <div class="val" id="pf-cel">—</div>
          </div>
          <div class="pf-item">
            <label>CEP</label>
            <div class="val" id="pf-cep">—</div>
          </div>
        </div>

        <!-- Card endereço (ocupa 2 colunas) -->
        <div class="pf-card" style="grid-column: 1 / -1;">
          <h2><i class="fa-solid fa-location-dot" style="color:var(--red)"></i> Endereço de entrega</h2>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex-wrap:wrap">
            <div class="pf-item"><label>Rua</label><div class="val" id="pf-rua">—</div></div>
            <div class="pf-item"><label>Número</label><div class="val" id="pf-num">—</div></div>
            <div class="pf-item"><label>Complemento</label><div class="val" id="pf-comp">—</div></div>
            <div class="pf-item"><label>Bairro</label><div class="val" id="pf-bairro">—</div></div>
            <div class="pf-item"><label>Cidade</label><div class="val" id="pf-cidade">—</div></div>
            <div class="pf-item"><label>Estado</label><div class="val" id="pf-estado">—</div></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<script src="../AppJs/shared.js"></script>
<script>
  authGuard(false, function() {
        var p = getParceiro();
    if (!p) return;

    // Avatar inicial do nome
    var inicial = (p.nome || '?')[0].toUpperCase();
    document.getElementById('pf-avatar').textContent = inicial;

    document.getElementById('pf-nome-big').textContent  = p.nome    || '—';
    document.getElementById('pf-email-sm').textContent  = p.email   || '—';
    document.getElementById('pf-email').textContent     = p.email   || '—';
    document.getElementById('pf-cel').textContent       = p.celular || '—';
    document.getElementById('pf-cep').textContent       = p.cep     || '—';
    document.getElementById('pf-rua').textContent       = p.rua     || '—';
    document.getElementById('pf-num').textContent       = p.numero  || '—';
    document.getElementById('pf-comp').textContent      = p.complemento || '—';
    document.getElementById('pf-bairro').textContent    = p.bairro  || '—';
    document.getElementById('pf-cidade').textContent    = p.cidade  || '—';
    document.getElementById('pf-estado').textContent    = p.estado  || '—';

    // Badge admin ou user
    var badge = document.getElementById('pf-role-badge');
    if (isAdmin()) {
      badge.innerHTML = '<span class="badge-admin"><i class="fa-solid fa-shield-halved"></i> Administrador</span>';
    } else {
      badge.innerHTML = '<span class="badge-user"><i class="fa-solid fa-user"></i> Usuário</span>';
    }
  });
</script>
</body>
</html>
