  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MamaFood — Cardápio</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#ea1d2c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MamaFood" />
  <link rel="apple-touch-icon" href="../IMG_2462-removebg-preview.png" />
  <link rel="icon" type="image/png" href="../IMG_2462-removebg-preview.png" />
  
  <script src="../AppJs/devtools-protection.js?v=2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../shared.css"/>
  <style>
    /* ── Category tabs ── */
    .cat-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
    .cat-tab {
      padding: 8px 20px;
      border-radius: 24px;
      border: 1.5px solid var(--border);
      font-size: .82rem;
      font-weight: 600;
      color: var(--gray-4);
      cursor: pointer;
      transition: all .15s;
      background: var(--surface);
    }
    .cat-tab:hover { border-color: var(--red); color: var(--red); background: var(--red-subtle); }
    .cat-tab.active { background: linear-gradient(135deg, var(--red), #ff6b7a); color: #fff; border-color: transparent; box-shadow: 0 3px 12px var(--red-glow); }

    /* ── Menu grid ── */
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }

    /* ── Menu card ── */
    .menu-card {
      background: var(--surface);
      border-radius: var(--r-lg);
      overflow: hidden;
      box-shadow: var(--shadow-xs);
      border: 1px solid var(--border);
      transition: box-shadow .2s, transform .2s;
    }
    .menu-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-4px); }

    .menu-card-img {
      height: 130px;
      background: linear-gradient(135deg, #f0f2f8, #e8eaf0);
      display: flex; align-items: center; justify-content: center;
      font-size: 4rem;
      position: relative;
      overflow: hidden;
    }
    .menu-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .menu-card-body { padding: 16px; }
    .menu-card-cat {
      font-size: .65rem;
      font-weight: 700;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 5px;
      background: var(--red-subtle);
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .menu-card-name { font-size: .95rem; font-weight: 800; color: var(--dark); margin-bottom: 5px; }
    .menu-card-desc { font-size: .78rem; color: var(--gray-3); margin-bottom: 14px; line-height: 1.45; min-height: 34px; }
    .menu-card-footer { display: flex; align-items: center; justify-content: space-between; }
    .menu-card-price { font-size: 1.1rem; font-weight: 900; color: var(--dark); }
    .menu-card-price small { font-size: .7rem; color: var(--gray-3); font-weight: 500; margin-right: 1px; }

    .btn-pedir {
      background: linear-gradient(135deg, var(--red), #ff6b7a);
      color: #fff;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: .82rem;
      font-weight: 700;
      transition: all .2s;
      display: flex; align-items: center; gap: 6px;
      box-shadow: 0 3px 10px var(--red-glow);
    }
    .btn-pedir:hover { box-shadow: 0 5px 16px var(--red-glow); transform: translateY(-1px); }

    /* ── Floating cart ── */
    .cart-float { position: fixed; bottom: 80px; right: 28px; z-index: 999; display: none; }
    .cart-float.show { display: block; animation: slideUp .4s cubic-bezier(.34,1.56,.64,1); }
    @keyframes slideUp { from{transform:translateY(80px) scale(.9);opacity:0} to{transform:translateY(0) scale(1);opacity:1} }

    .cart-btn {
      background: linear-gradient(135deg, var(--dark), #1a1d35);
      color: #fff;
      padding: 14px 24px;
      border-radius: 50px;
      box-shadow: 0 8px 32px rgba(15,17,32,.4);
      display: flex; align-items: center; gap: 12px;
      cursor: pointer;
      transition: all .2s;
      border: 1px solid rgba(255,255,255,.08);
      font-family: inherit;
      font-size: .95rem;
      font-weight: 700;
    }
    .cart-btn:hover { box-shadow: 0 12px 40px rgba(15,17,32,.5); transform: translateY(-2px); }
    .cart-badge {
      background: var(--red);
      color: #fff;
      border-radius: 50%;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      font-size: .78rem;
      font-weight: 900;
      box-shadow: 0 2px 8px var(--red-glow);
    }
    .cart-total { font-size: 1rem; font-weight: 900; letter-spacing: -.01em; }
  </style>

</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <div><span class="topbar-title">Cardápio</span><span class="topbar-sub"> — escolha o que quiser</span></div>
      <div class="topbar-right">
        <div class="topbar-time"><i class="fa-regular fa-clock"></i><span id="clock">--:--</span></div>
      </div>
    </div>
    <div class="content">
      <div class="cat-tabs" id="catTabs"></div>
      <div class="menu-grid" id="menuGrid"></div>
    </div>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<!-- Carrinho Flutuante -->
<div class="cart-float" id="cartFloat">
  <button class="cart-btn" onclick="irParaCarrinho()">
    <i class="fa-solid fa-shopping-cart cart-icon"></i>
    <span class="cart-badge" id="cartCount">0</span>
    <span class="cart-total" id="cartTotal">R$ 0,00</span>
  </button>
</div>

<script src="../AppJs/shared.js"></script>
<script>
var catAtual = 'Todos';

function getCardapio() {
  return JSON.parse(localStorage.getItem('mf_cardapio') || '[]');
}

function renderCats(items) {
  var cats = ['Todos'];
  items.forEach(function(i){ if(cats.indexOf(i.categoria)<0) cats.push(i.categoria); });
  document.getElementById('catTabs').innerHTML = cats.map(function(c){
    return '<button class="cat-tab'+(c===catAtual?' active':'')+'" onclick="filterCat(\''+c+'\')">' + c + '</button>';
  }).join('');
}

function filterCat(cat) {
  catAtual = cat;
  var items = getCardapio();
  renderCats(items);
  var list = cat==='Todos' ? items : items.filter(function(i){return i.categoria===cat;});
  itemsGlobal = list; // Salva globalmente
  renderGrid(list);
}

function renderGrid(items) {
  var el = document.getElementById('menuGrid');
  if (!items.length) {
    el.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><i class="fa-solid fa-utensils"></i><h3>Nenhum item encontrado</h3><p>O cardápio será exibido aqui quando o admin adicionar produtos.</p></div>';
    return;
  }
  el.innerHTML = items.map(function(p, idx){
    var imgHtml = p.imagem
      ? '<img src="'+p.imagem+'" alt="'+esc(p.nome)+'" style="width:100%;height:100%;object-fit:cover;display:block"/>'
      : (p.emoji||'🍽️');
    return '<div class="menu-card">' +
      '<div class="menu-card-img">' + imgHtml + '</div>' +
      '<div class="menu-card-body">' +
        '<div class="menu-card-cat">' + esc(p.categoria||'') + '</div>' +
        '<div class="menu-card-name">' + esc(p.nome) + '</div>' +
        '<div class="menu-card-desc">' + esc(p.descricao||'') + '</div>' +
        '<div class="menu-card-footer">' +
          '<span class="menu-card-price">R$ ' + Number(p.preco).toFixed(2).replace('.',',') + '</span>' +
          '<button class="btn-pedir" onclick="adicionarPedido('+idx+')"><i class="fa-solid fa-cart-plus"></i> Adicionar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// Guarda os itens globalmente para acesso nas funções
var itemsGlobal = [];

function adicionarPedido(idx) {
  var produto = itemsGlobal[idx];
  if (!produto) {
    console.error('Produto não encontrado no índice:', idx);
    return;
  }
  
  var carrinho = JSON.parse(localStorage.getItem('mf_carrinho')||'[]');
  var idxCarrinho = carrinho.findIndex(function(i){return i.id===produto.id;});
  
  if(idxCarrinho>=0){ 
    carrinho[idxCarrinho].qty++; 
  } else { 
    carrinho.push({
      id:produto.id,
      nome:produto.nome,
      preco:produto.preco,
      emoji:produto.emoji||'🍽️',
      imagem:produto.imagem||'',
      qty:1
    }); 
  }
  
  localStorage.setItem('mf_carrinho', JSON.stringify(carrinho));
  showToast((produto.emoji||'🍽️')+' '+produto.nome+' adicionado!','ok');
  atualizarCarrinhoFloat();
}

function atualizarCarrinhoFloat() {
  var carrinho = JSON.parse(localStorage.getItem('mf_carrinho')||'[]');
  var total = carrinho.reduce(function(sum,i){return sum+(i.preco*i.qty);},0);
  var qtd = carrinho.reduce(function(sum,i){return sum+i.qty;},0);
  
  var floatEl = document.getElementById('cartFloat');
  var countEl = document.getElementById('cartCount');
  var totalEl = document.getElementById('cartTotal');
  
  if(qtd > 0) {
    floatEl.classList.add('show');
    countEl.textContent = qtd;
    totalEl.textContent = 'R$ ' + total.toFixed(2).replace('.',',');
  } else {
    floatEl.classList.remove('show');
  }
}

function irParaCarrinho() {
  window.location.href = 'checkout.html';
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Função para carregar e renderizar o cardápio
function carregarCardapio() {
  var items = getCardapio();
  itemsGlobal = items;
  renderCats(items);
  var list = catAtual === 'Todos' ? items : items.filter(function(i){return i.categoria === catAtual;});
  itemsGlobal = list;
  renderGrid(list);
}

// Atualização em tempo real via localStorage events (funciona entre abas/dispositivos na mesma máquina)
window.addEventListener('storage', function(e) {
  if (e.key === 'mf_cardapio' && e.newValue) {
    console.log('🔄 Cardápio atualizado em outra aba!');
    carregarCardapio();
    showToast('✨ Novos itens disponíveis!', 'ok');
  }
});

// Verifica mudanças localmente a cada 3 segundos (para casos sem storage event)
var ultimoCardapio = JSON.stringify(getCardapio());
setInterval(function() {
  var atual = JSON.stringify(getCardapio());
  if (atual !== ultimoCardapio) {
    console.log('🔄 Cardápio atualizado!');
    ultimoCardapio = atual;
    carregarCardapio();
    showToast('✨ Novos itens disponíveis!', 'ok');
  }
}, 3000);

authGuard(false, function() {
  carregarCardapio();
  atualizarCarrinhoFloat();
});
</script>
</body>
</html>
