<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MamaFood — Favoritos</title>
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#ea1d2c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MamaFood" />
  <link rel="apple-touch-icon" href="../IMG_2462-removebg-preview.png" />
  <link rel="icon" type="image/png" href="../IMG_2462-removebg-preview.png" />
  <script src="../AppJs/devtools-protection.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../shared.css"/>
  <style>
    .fav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    
    .fav-card {
      background: var(--surface);
      border-radius: var(--r-lg);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: all .2s;
      box-shadow: var(--shadow-xs);
    }
    .fav-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-4px); }
    
    .fav-img {
      height: 140px;
      background: linear-gradient(135deg, #f0f2f8, #e8eaf0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      position: relative;
    }
    .fav-img img { width: 100%; height: 100%; object-fit: cover; }
    
    .fav-heart {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,.95);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .2s;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    .fav-heart:hover { transform: scale(1.1); }
    .fav-heart i { color: #ff3040; font-size: .95rem; }
    
    .fav-body { padding: 16px; }
    .fav-name { font-size: 1rem; font-weight: 800; color: var(--dark); margin-bottom: 6px; }
    .fav-desc { font-size: .8rem; color: var(--gray-3); margin-bottom: 14px; line-height: 1.4; }
    
    .fav-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .fav-price { font-size: 1.1rem; font-weight: 900; color: var(--dark); }
    
    .btn-add {
      background: linear-gradient(135deg, var(--red), #ff6b7a);
      color: #fff;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: .82rem;
      font-weight: 700;
      transition: all .2s;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 10px var(--red-glow);
      border: none;
      cursor: pointer;
    }
    .btn-add:hover { box-shadow: 0 5px 16px var(--red-glow); transform: translateY(-1px); }
    
    .empty-state {
      grid-column: 1/-1;
      text-align: center;
      padding: 80px 20px;
      color: var(--gray-3);
    }
    .empty-state i { font-size: 5rem; color: var(--gray-2); margin-bottom: 24px; }
    .empty-state h3 { font-size: 1.4rem; font-weight: 800; color: var(--dark); margin-bottom: 10px; }
    .empty-state p { font-size: .95rem; margin-bottom: 24px; }
    .empty-state a {
      display: inline-block;
      background: linear-gradient(135deg, var(--red), #ff6b7a);
      color: #fff;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 700;
      transition: all .2s;
      text-decoration: none;
    }
    .empty-state a:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--red-glow); }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <div><span class="topbar-title">Favoritos</span><span class="topbar-sub"> — seus itens preferidos</span></div>
      <div class="topbar-right">
        <div class="topbar-time"><i class="fa-regular fa-clock"></i><span id="clock">--:--</span></div>
      </div>
    </div>
    <div class="content">
      <div class="fav-grid" id="favGrid"></div>
    </div>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="../AppJs/shared.js"></script>
<script>
function getFavoritos() {
  var p = getParceiro();
  if (!p || !p.email) return [];
  return JSON.parse(localStorage.getItem('mf_favoritos_' + p.email) || '[]');
}

function removerFavorito(itemId) {
  var p = getParceiro();
  if (!p || !p.email) return;
  var favs = getFavoritos();
  favs = favs.filter(function(f){ return f.id !== itemId; });
  localStorage.setItem('mf_favoritos_' + p.email, JSON.stringify(favs));
  renderFavoritos();
  showToast('💔 Removido dos favoritos', 'ok');
}

function adicionarCarrinho(item) {
  var carrinho = JSON.parse(localStorage.getItem('mf_carrinho') || '[]');
  var idx = carrinho.findIndex(function(i){ return i.id === item.id; });
  
  if (idx >= 0) {
    carrinho[idx].qty++;
  } else {
    carrinho.push({
      id: item.id,
      nome: item.nome,
      preco: item.preco,
      emoji: item.emoji || '🍽️',
      imagem: item.imagem || '',
      qty: 1
    });
  }
  
  localStorage.setItem('mf_carrinho', JSON.stringify(carrinho));
  showToast('✅ ' + item.nome + ' adicionado ao carrinho!', 'ok');
}

function renderFavoritos() {
  var favs = getFavoritos();
  var el = document.getElementById('favGrid');
  
  if (!favs.length) {
    el.innerHTML = '<div class="empty-state anim-fade-up">' +
      '<i class="fa-solid fa-heart-crack"></i>' +
      '<h3>Nenhum favorito ainda</h3>' +
      '<p>Adicione itens do cardápio aos favoritos para encontrá-los rapidamente aqui!</p>' +
      '<a href="cardapio.html"><i class="fa-solid fa-utensils"></i> Ver cardápio</a>' +
    '</div>';
    return;
  }
  
  el.innerHTML = favs.map(function(item){
    var imgHtml = item.imagem
      ? '<img src="' + item.imagem + '" alt="' + esc(item.nome) + '"/>'
      : (item.emoji || '🍽️');
    
    return '<div class="fav-card anim-fade-up">' +
      '<div class="fav-img">' + imgHtml +
        '<button class="fav-heart" onclick="removerFavorito(\'' + item.id + '\')" title="Remover dos favoritos">' +
          '<i class="fa-solid fa-heart"></i>' +
        '</button>' +
      '</div>' +
      '<div class="fav-body">' +
        '<div class="fav-name">' + esc(item.nome) + '</div>' +
        '<div class="fav-desc">' + esc(item.descricao || '') + '</div>' +
        '<div class="fav-footer">' +
          '<span class="fav-price">R$ ' + Number(item.preco).toFixed(2).replace('.', ',') + '</span>' +
          '<button class="btn-add" onclick=\'adicionarCarrinho(' + JSON.stringify(item) + ')\'>' +
            '<i class="fa-solid fa-cart-plus"></i> Adicionar' +
          '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }

authGuard(false, function() {
  renderFavoritos();
});
</script>
</body>
</html>
